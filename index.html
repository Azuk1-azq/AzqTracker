<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azq Tracker</title>
  <meta property="og:url" content="https://azqtracker.f5.si/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="AzqTracker">
  <meta property="og:description"
    content="AzqTrackerとは、軽量なDiscordにRobloxのプレイ状況を表示するツールです。 Pythonで作られており、コードが公開されています。バックグラウンド起動時のメモリ使用率は約20MBです。 AzqTracker is a lightweight tool that displays your Roblox gameplay status on Discord. It is written in Python, and its source code is publicly available.Memory usage when running in the background is approximately 20 MB.">
  <meta property="og:site_name" content="AzqTracker">
  <meta property="og:locale" content="ja_JP">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --md-primary: #6C79F7;
      --md-on-primary: #10123A;
      --md-primary-container: #2B2E77;
      --md-on-primary-container: #DEE0FF;

      --md-secondary: #FF7A59;
      --md-on-secondary: #3A1204;
      --md-secondary-container: #58230F;
      --md-on-secondary-container: #FFDBCE;

      --md-tertiary: #5FDDB0;
      --md-on-tertiary: #00382A;

      --md-background: #101116;
      --md-surface: #16171E;
      --md-surface-container: #1C1E26;
      --md-surface-container-high: #24262F;
      --md-surface-container-highest: #2C2F3A;
      --md-on-surface: #E4E2EA;
      --md-on-surface-variant: #A8A9B8;
      --md-outline: #3C3E4A;
      --md-outline-variant: #2A2C36;
      --md-error: #FFB4A9;

      --font-display: "Space Grotesk", "Roboto", sans-serif;
      --font-body: "Roboto", "Hiragino Sans", sans-serif;
      --font-mono: "Roboto Mono", monospace;

      --elevation-1: 0 1px 2px rgba(0, 0, 0, 0.45), 0 1px 3px 1px rgba(0, 0, 0, 0.30);
      --elevation-2: 0 1px 2px rgba(0, 0, 0, 0.5), 0 2px 6px 2px rgba(0, 0, 0, 0.35);
      --elevation-3: 0 4px 8px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.5);
      --elevation-4: 0 8px 24px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--md-background);
      color: var(--md-on-surface);
      font-family: var(--font-body);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header.top {
      padding: 28px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 18px;
    }

    .brand .mark {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--md-primary), var(--md-secondary));
      display: inline-block;
    }

    .lang-toggle {
      display: flex;
      background: var(--md-surface-container-high);
      border-radius: 100px;
      padding: 3px;
      gap: 2px;
    }

    .lang-toggle button {
      border: none;
      background: transparent;
      color: var(--md-on-surface-variant);
      font-family: var(--font-body);
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 100px;
      cursor: pointer;
    }

    .lang-toggle button.active {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--md-surface-container-high);
      color: var(--md-on-surface-variant);
      text-decoration: none;
      transition: background 140ms ease, color 140ms ease;
    }
    .icon-btn:hover {
      background: var(--md-surface-container-highest);
      color: var(--md-on-surface);
    }

    .hero {
      padding: 72px 0 56px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 48px;
      align-items: center;
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.12;
      letter-spacing: -0.01em;
      margin: 0 0 20px;
    }

    .hero p.lead {
      font-size: 17px;
      color: var(--md-on-surface-variant);
      max-width: 46ch;
      margin: 0 0 32px;
    }

    .cta-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 16px;
      background: #17392F;
      color: var(--md-tertiary);
      font-size: 12.5px;
      font-weight: 500;
      padding: 7px 14px 7px 10px;
      border-radius: 100px;
      width: fit-content;
    }
    .chip svg { width: 15px; height: 15px; }

    .btn {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: 15px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 100px;
      transition: box-shadow 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .btn-filled {
      background: var(--md-primary);
      color: var(--md-on-primary);
      box-shadow: var(--elevation-1);
    }

    .btn-filled:hover {
      box-shadow: var(--elevation-2);
      transform: translateY(-1px);
    }

    .btn-tonal {
      background: var(--md-surface-container-high);
      color: var(--md-on-surface);
    }

    .btn-tonal:hover {
      background: var(--md-surface-container-highest);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .mock {
      background: var(--md-surface-container);
      border-radius: 28px;
      box-shadow: var(--elevation-3);
      overflow: hidden;
      border: 1px solid var(--md-outline-variant);
    }

    .mock .tabbar {
      background: var(--md-surface-container-high);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--md-outline-variant);
    }

    .mock .tabbar .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--md-outline);
    }

    .mock .tabbar .url {
      margin-left: 8px;
      background: var(--md-surface);
      color: var(--md-on-surface-variant);
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 100px;
      font-family: var(--font-mono);
    }

    .mock .screen {
      padding: 18px;
    }

    .mock .card {
      background: var(--md-surface-container-high);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .mock .card h4 {
      margin: 0 0 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--md-on-surface-variant);
    }

    .mock .row {
      font-size: 13px;
      margin: 4px 0;
    }

    .mock .status-ok {
      color: var(--md-tertiary);
      font-weight: 500;
    }

    .mock .btn-mini {
      display: inline-block;
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 100px;
      margin-right: 6px;
    }

    .mock .log {
      background: var(--md-background);
      border-radius: 12px;
      padding: 10px 12px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--md-on-surface-variant);
      line-height: 1.7;
    }

    .mock .log .hit {
      color: var(--md-tertiary);
    }

    section {
      padding: 56px 0;
    }

    .section-title {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 26px;
      margin: 0 0 8px;
    }

    .section-sub {
      color: var(--md-on-surface-variant);
      margin: 0 0 36px;
      max-width: 56ch;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .feature {
      background: var(--md-surface-container);
      border-radius: 20px;
      padding: 24px 22px;
      border: 1px solid var(--md-outline-variant);
    }

    .feature .icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .feature .icon svg {
      width: 20px;
      height: 20px;
    }

    .feature h3 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .feature p {
      font-size: 14px;
      color: var(--md-on-surface-variant);
      margin: 0;
    }

    .feature:nth-child(1) .icon {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
    }

    .feature:nth-child(2) .icon {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    .feature:nth-child(3) .icon {
      background: #17392F;
      color: var(--md-tertiary);
    }

    .steps {
      display: flex;
      flex-direction: column;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid var(--md-outline-variant);
    }

    .step {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 20px;
      padding: 22px 24px;
      background: var(--md-surface-container);
    }

    .step+.step {
      border-top: 1px solid var(--md-outline-variant);
    }

    .step .num {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: var(--md-surface-container-highest);
      color: var(--md-primary);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step h3 {
      margin: 4px 0 6px;
      font-size: 15.5px;
      font-weight: 600;
      font-family: var(--font-body);
    }

    .step p {
      margin: 0;
      font-size: 14px;
      color: var(--md-on-surface-variant);
    }

    .step code {
      background: var(--md-surface-container-highest);
      color: var(--md-on-surface);
      padding: 2px 7px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 12.5px;
    }

    .req {
      background: var(--md-surface-container);
      border-radius: 24px;
      padding: 28px 28px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      border: 1px solid var(--md-outline-variant);
    }

    .req .item .label {
      font-size: 12px;
      color: var(--md-on-surface-variant);
      margin-bottom: 6px;
    }

    .req .item .value {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 16px;
    }

    footer {
      padding: 40px 0 60px;
      color: var(--md-on-surface-variant);
      font-size: 13px;
      border-top: 1px solid var(--md-outline-variant);
      margin-top: 24px;
    }

    footer p {
      max-width: 60ch;
    }

    /* ---- モーダル(ダイアログ) ---- */
    .scrim {
      position: fixed;
      inset: 0;
      background: rgba(6, 7, 10, 0.65);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
    }

    .scrim.open {
      display: flex;
    }

    .dialog {
      background: var(--md-surface-container-high);
      border-radius: 28px;
      box-shadow: var(--elevation-4);
      width: 100%;
      max-width: 460px;
      padding: 28px;
      border: 1px solid var(--md-outline-variant);
    }

    .dialog.wide {
      max-width: 560px;
    }

    .dialog h2 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .dialog p.sub {
      color: var(--md-on-surface-variant);
      font-size: 13.5px;
      margin: 0 0 22px;
    }

    .dialog .close-x {
      float: right;
      background: none;
      border: none;
      color: var(--md-on-surface-variant);
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      border: 1px solid var(--md-outline-variant);
      border-radius: 18px;
      padding: 16px 18px;
      margin-bottom: 12px;
      cursor: pointer;
      background: var(--md-surface-container);
      transition: border-color 140ms ease, background 140ms ease;
    }

    .option:hover {
      border-color: var(--md-primary);
      background: var(--md-surface-container-highest);
    }

    .option .tag {
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 100px;
      display: inline-block;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .option.recommended .tag {
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
    }

    .option.advanced .tag {
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    .option h4 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
    }

    .option p {
      margin: 0;
      font-size: 12.5px;
      color: var(--md-on-surface-variant);
    }

    .howto-step {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }

    .howto-step:last-child {
      margin-bottom: 0;
    }

    .howto-step .num {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: var(--md-surface-container-highest);
      color: var(--md-primary);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .howto-step h4 {
      margin: 2px 0 4px;
      font-size: 14.5px;
      font-weight: 600;
    }

    .howto-step p {
      margin: 0;
      font-size: 13px;
      color: var(--md-on-surface-variant);
    }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 44px;
      }

      .features {
        grid-template-columns: 1fr;
      }

      .req {
        grid-template-columns: 1fr;
      }

      .step {
        grid-template-columns: 44px 1fr;
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="top">
    <div class="wrap" style="display:flex; align-items:center; justify-content:space-between;">
      <div class="brand"><span class="mark"></span>Azq Tracker</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <a class="icon-btn" href="https://github.com/Azuk1-azq/AzqTracker" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.09 3.29 9.4 7.86 10.93.58.1.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.16.08 1.78 1.19 1.78 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.68 0-1.25.45-2.28 1.18-3.08-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.9 10.9 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.74.8 1.18 1.83 1.18 3.08 0 4.41-2.69 5.38-5.25 5.67.42.36.78 1.08.78 2.17 0 1.57-.01 2.83-.01 3.22 0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5z"/></svg>
        </a>
        <div class="lang-toggle">
          <button id="lang-ja" class="active" onclick="setLang('ja')">日本語</button>
          <button id="lang-en" onclick="setLang('en')">English</button>
        </div>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="hero">
      <div>
        <h1 data-i18n="hero_title"></h1>
        <p class="lead" data-i18n="hero_lead"></p>
        <div class="cta-row">
          <a class="btn btn-filled" onclick="openDownloadModal(event)" href="#">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16" />
            </svg>
            <span data-i18n="hero_download_btn"></span>
          </a>
          <a class="btn btn-tonal" onclick="openHowtoModal(event)" href="#"><span data-i18n="hero_howto_btn"></span></a>
        </div>
        <div class="chip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
          <span data-i18n="hero_chip"></span>
        </div>
      </div>

      <div class="mock">
        <div class="tabbar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="url">127.0.0.1:47882</span>
        </div>
        <div class="screen">
          <div class="card">
            <h4 data-i18n="mock_status_title"></h4>
            <div class="row"><span data-i18n="mock_discord_label"></span> <span class="status-ok"
                data-i18n="mock_discord_value"></span></div>
            <div class="row"><span data-i18n="mock_game_label"></span> Untitled place</div>
          </div>
          <div class="card">
            <span class="btn-mini" data-i18n="mock_btn_start"></span><span class="btn-mini"
              data-i18n="mock_btn_stop"></span>
          </div>
          <div class="log">
            <span data-i18n="mock_log_1"></span><br>
            <span class="hit" data-i18n="mock_log_2"></span><br>
            <span data-i18n="mock_log_3"></span> Untitled place
          </div>
        </div>
      </div>
    </section>

    <section id="features">
      <h2 class="section-title" data-i18n="features_title"></h2>
      <p class="section-sub" data-i18n="features_sub"></p>
      <div class="features">
        <div class="feature">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 3" />
            </svg></div>
          <h3 data-i18n="feature1_title"></h3>
          <p data-i18n="feature1_desc"></p>
        </div>
        <div class="feature">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="4" width="16" height="16" rx="4" />
              <path d="M8 12h8M8 16h5" />
            </svg></div>
          <h3 data-i18n="feature2_title"></h3>
          <p data-i18n="feature2_desc"></p>
        </div>
        <div class="feature">
          <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M5 13l4 4L19 7" />
            </svg></div>
          <h3 data-i18n="feature3_title"></h3>
          <p data-i18n="feature3_desc"></p>
        </div>
      </div>
    </section>

    <section id="requirements">
      <h2 class="section-title" data-i18n="req_title"></h2>
      <div class="req">
        <div class="item">
          <div class="label" data-i18n="req_os_label"></div>
          <div class="value" data-i18n="req_os_value"></div>
        </div>
        <div class="item">
          <div class="label" data-i18n="req_python_label"></div>
          <div class="value" data-i18n="req_python_value"></div>
        </div>
        <div class="item">
          <div class="label" data-i18n="req_install_label"></div>
          <div class="value" data-i18n="req_install_value"></div>
        </div>
      </div>
    </section>

    <footer>
      <p data-i18n="footer_text"></p>
    </footer>
  </div>

  <!-- ダウンロード方法選択モーダル -->
  <div class="scrim" id="download-scrim" onclick="if(event.target===this) closeModal('download-scrim')">
    <div class="dialog">
      <button class="close-x" onclick="closeModal('download-scrim')">&times;</button>
      <h2 data-i18n="dl_modal_title"></h2>
      <p class="sub" data-i18n="dl_modal_sub"></p>

      <div class="option recommended" id="option-exe" onclick="downloadExe()">
        <div>
          <span class="tag recommended" data-i18n="dl_tag_recommended"></span>
          <h4 data-i18n="dl_exe_title"></h4>
          <p data-i18n="dl_exe_desc"></p>
        </div>
      </div>

      <div class="option advanced" id="option-pyw" onclick="downloadPyw()">
        <div>

    let currentLang = "ja";

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.getElementById("lang-ja").classList.toggle("active", lang === "ja");
      document.getElementById("lang-en").classList.toggle("active", lang === "en");
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (translations[lang][key] !== undefined) {
          el.textContent = translations[lang][key];
        }
      });
    }

    function openDownloadModal(e) {
      if (e) e.preventDefault();
      document.getElementById("download-scrim").classList.add("open");
    }
    function openHowtoModal(e) {
      if (e) e.preventDefault();
      document.getElementById("howto-scrim").classList.add("open");
    }
    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function downloadExe() {
      const a = document.createElement("a");
      a.href = "https://github.com/Azuk1-azq/AzqTracker/releases/download/Latest/AzqTrackerv2.0.zip";
      a.download = "AzqTrackerv2.0.zip";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      closeModal("download-scrim");
    }

    function downloadPyw() {
      const blob = new Blob(
        [Uint8Array.from(atob(AZQ_TRACKER_B64), c => c.charCodeAt(0))],
        { type: "text/plain" }
      );
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "AzqTracker.pyw";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      closeModal("download-scrim");
    }

    setLang("ja");
